<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWA Game MVP</title>
    <!-- КРИТИЧЕСКИ ВАЖНО: Подключаем Telegram WebApp SDK -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .job-card {
            background-color: #2a2a2a;
            border: 2px solid #3a3a3a;
            border-radius: 10px;
            padding: 15px;
            margin: 15px auto;
            max-width: 300px;
            cursor: pointer;
            transition: 0.3s;
        }
        .job-card.selected {
            border-color: #0088cc;
            background-color: #223344;
        }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            max-width: 300px;
        }
        button:disabled {
            background-color: #555555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h2>💼 Биржа труда</h2>
    <p>Выберите профессию и начните 8-часовую смену:</p>

    <!-- Сюда JS вставит список доступных работ -->
    <div id="jobs-container"></div>

    <!-- Кнопка отправки данных в бот -->
    <button id="work-btn" disabled>Начать работу</button>

    <script>
        // Инициализируем Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем приложение на весь экран

        // Список профессий (для MVP храним прямо на фронтенде)
        const jobs = [
            { id: "loader", name: "Грузчик", salary: "500 руб" },
            { id: "courier", name: "Курьер", salary: "500 руб" },
            { id: "driver", name: "Водитель", salary: "500 руб" }
        ];

        let selectedJobId = null;

        // Рендерим список работ на экран
        const container = document.getElementById("jobs-container");
        jobs.forEach(job => {
            const card = document.createElement("div");
            card.className = "job-card";
            card.innerHTML = `<h3>${job.name}</h3><p>Зарплата: ${job.salary}</p>`;
            
            card.addEventListener("click", () => {
                // Снимаем выделение со всех карт
                document.querySelectorAll(".job-card").forEach(c => c.classList.remove("selected"));
                // Выделяем текущую
                card.classList.add("selected");
                selectedJobId = job.id;
                // Активируем кнопку
                document.getElementById("work-btn").disabled = false;
            });
            
            container.appendChild(card);
        });

        // Обработка клика по кнопке «Начать работу»
        document.getElementById("work-btn").addEventListener("click", () => {
            if (!selectedJobId) return;

            // Формируем JSON-пакет строго под логику нашего bot.py
            const payload = {
                action: "start_work",
                job_id: selectedJobId
            };

            // Отправляем данные в бот и закрываем Mini App
            tg.sendData(JSON.stringify(payload));
            tg.close();
        });
    </script>
</body>
</html>
