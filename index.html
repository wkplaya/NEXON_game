<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hexon Game</title>
    <!-- Подключаем SDK Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h2 {
            margin-top: 10px;
            color: #2f80ed;
            font-size: 24px;
        }
        .description {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .job-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }
        .job-card {
            background-color: #2c2c2e;
            border: 2px solid #3a3a3c;
            border-radius: 14px;
            padding: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            -webkit-tap-highlight-color: transparent;
        }
        .job-card h3 {
            margin: 0 0 6px 0;
            font-size: 18px;
        }
        .job-card p {
            margin: 0;
            font-size: 14px;
            color: #34c759;
            font-weight: bold;
        }
        .job-card.selected {
            border-color: #2f80ed;
            background-color: #1c2e4a;
            box-shadow: 0 0 10px rgba(0, 136, 204, 0.5);
        }
    </style>
</head>
<body>

    <h2>💼 Биржа труда</h2>
    <p class="description">Выберите доступную вакансию для старта смены:</p>

    <!-- Карточки зашиты жестко в HTML, чтобы они гарантированно отображались -->
    <div id="jobs" class="job-list">
        <div class="job-card" data-id="loader" onclick="selectJob(this, 'loader')">
            <h3>👷 Грузчик на склад</h3>
            <p>Выплата: 500 руб / 8 часов</p>
        </div>
        <div class="job-card" data-id="courier" onclick="selectJob(this, 'courier')">
            <h3>🚴 Курьер доставки</h3>
            <p>Выплата: 500 руб / 8 часов</p>
        </div>
        <div class="job-card" data-id="driver" onclick="selectJob(this, 'driver')">
            <h3>🚗 Водитель такси</h3>
            <p>Выплата: 500 руб / 8 часов</p>
        </div>
    </div>

    <script>
        // Инициализация WebApp с проверкой на ошибки
        let tg = null;
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            try {
                tg.ready();
                tg.expand();
            } catch(e) {
                console.error("Ошибка инициализации Telegram SDK:", e);
            }
        }

        let selectedJob = null;

        function selectJob(element, jobId) {
            // Убираем старое выделение
            document.querySelectorAll('.job-card').forEach(card => card.classList.remove('selected'));
            
            // Ставим новое
            element.classList.add('selected');
            selectedJob = jobId;

            // Настраиваем системную кнопку, если мы внутри Telegram
            if (tg && tg.MainButton) {
                tg.MainButton.text = "НАЧАТЬ СМЕНУ (8 ЧАСОВ)";
                tg.MainButton.color = "#2f80ed";
                tg.MainButton.textColor = "#ffffff";
                tg.MainButton.show();
            }
        }

        // Клик по главной кнопке Telegram внизу экрана
        if (tg && tg.MainButton) {
            tg.MainButton.onClick(() => {
                if (!selectedJob) return;

                const botUsername = "Hexon_game_bot";
                const link = `https://t.me{botUsername}?start=work_${selectedJob}`;
                
                tg.openTelegramLink(link);
                tg.close();
            });
        }
    </script>
</body>
</html>
