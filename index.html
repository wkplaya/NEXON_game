<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexon Game MVP</title>
    <!-- Подключаем официальный скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h2 {
            margin-top: 10px;
            color: #0088cc;
        }
        .job-container {
            margin-top: 20px;
        }
        .job-card {
            background-color: #2a2a2a;
            border: 2px solid #3a3a3a;
            border-radius: 12px;
            padding: 15px;
            margin: 12px auto;
            max-width: 320px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .job-card:hover {
            transform: scale(1.02);
        }
        .job-card.selected {
            border-color: #0088cc;
            background-color: #1a3a54;
            box-shadow: 0 0 10px rgba(0, 136, 204, 0.5);
        }
        .salary {
            font-weight: bold;
            color: #4caf50;
        }
    </style>
</head>
<body>

    <h2>💼 Биржа труда</h2>
    <p>Выберите профессию, чтобы начать 8-часовую смену:</p>

    <div id="jobs-list" class="job-container"></div>

    <script>
        // Инициализация WebApp среды Telegram
        const tg = window.Telegram.WebApp;
        tg.expand(); // Открываем приложение на максимум вверх

        // Список профессий
        const jobs = [
            { id: "loader", name: "👷 Грузчик", salary: "500 руб" },
            { id: "courier", name: "🚴 Курьер", salary: "500 руб" },
            { id: "driver", name: "🚗 Водитель", salary: "500 руб" }
        ];

        let selectedJobId = null;
        const listElement = document.getElementById("jobs-list");

        // Управление нативной кнопкой Telegram (Main Button)
        const mainButton = tg.MainButton;
        mainButton.setText("НАЧАТЬ РАБОТУ");
        mainButton.color = "#0088cc";
        mainButton.textColor = "#ffffff";

        // Отрисовка списка профессий на экране
        jobs.forEach(job => {
            const card = document.createElement("div");
            card.className = "job-card";
            card.innerHTML = `<h3>${job.name}</h3><p>Зарплата за смену: <span class="salary">${job.salary}</span></p>`;
            
            card.addEventListener("click", () => {
                // Снимаем выделение с других карточек
                document.querySelectorAll(".job-card").forEach(c => c.classList.remove("selected"));
                // Выделяем текущую
                card.classList.add("selected");
                selectedJobId = job.id;
                
                // Показываем нижнюю нативную кнопку Telegram
                mainButton.show();
            });
            
            listElement.appendChild(card);
        });

        // Обработка клика по системной нижней кнопке Telegram
        mainButton.onClick(() => {
            if (!selectedJobId) return;

            // Формируем безопасный диплинк для вашего бота @Hexon_game_bot
            const botUsername = "Hexon_game_bot"; 
            const deepLink = `https://t.me{botUsername}?start=work_${selectedJobId}`;
            
            // Нативно перенаправляем пользователя в чат и закрываем мини-апп
            tg.openTelegramLink(deepLink);
            tg.close();
        });
    </script>
</body>
</html>
