<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hexon Game Hub</title>
    <script src="https://telegram.org"></script>
    <style>
        /* Настраиваемые цвета темы (легко поменять под себя) */
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c1e;
            --accent-blue: #2f80ed;
            --accent-green: #34c759;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #2c2c2e;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }
        .header-balance {
            background: linear-gradient(135deg, #2c2c2e, #1c1c1e);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .balance-item span { display: block; font-size: 12px; color: var(--text-muted); }
        .balance-item strong { font-size: 16px; color: var(--accent-green); }
        
        .tabs {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 16px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
        }
        .tab.active { background-color: var(--accent-blue); color: var(--text-main); }
        .page { display: none; }
        .page.active { display: block; }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .card h3 { margin: 0 0 4px 0; font-size: 16px; }
        .card p { margin: 0 0 10px 0; font-size: 13px; color: var(--text-muted); }
        
        .action-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-blue { background-color: var(--accent-blue); color: #fff; }
        .btn-green { background-color: var(--accent-green); color: #fff; }
        .btn-disabled { background-color: #3a3a3c; color: var(--text-muted); cursor: not-allowed; }
        
        .timer-box { color: #ff9f0a; font-weight: bold; font-size: 14px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <!-- Шапка с балансом -->
    <div class="header-balance">
        <div class="balance-item">
            <span>Рубли</span>
            <strong id="rub-val">0.00 ₽</strong>
        </div>
        <div class="balance-item">
            <span>NEXON</span>
            <strong id="nexon-val" style="color: #00c7be;">0.0000</strong>
        </div>
    </div>

    <!-- Вкладки -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('work-page', this)">💼 Работа</button>
        <button class="tab" onclick="switchTab('business-page', this)">🏪 Купить бизнес</button>
    </div>

    <!-- Страница 1: Работа с кнопками и отсчетом -->
    <div id="work-page" class="page active">
        <div id="work-status-container" class="timer-box" style="display:none;"></div>
        
        <div class="card">
            <h3>👷 Грузчик на склад</h3>
            <p>Зарплата: 500 руб / 8 часов</p>
            <button id="btn-work-loader" class="action-btn btn-blue" onclick="triggerAction('work', 'loader')">Начать смену (8ч)</button>
        </div>
        <div class="card">
            <h3>🚴 Курьер доставки</h3>
            <p>Зарплата: 500 руб / 8 часов</p>
            <button id="btn-work-courier" class="action-btn btn-blue" onclick="triggerAction('work', 'courier')">Начать смену (8ч)</button>
        </div>
        <div class="card">
            <h3>🚗 Водитель такси</h3>
            <p>Зарплата: 500 руб / 8 часов</p>
            <button id="btn-work-driver" class="action-btn btn-blue" onclick="triggerAction('work', 'driver')">Начать смену (8ч)</button>
        </div>
    </div>

    <!-- Страница 2: Покупка бизнеса с кнопками -->
    <div id="business-page" class="page">
        <div class="card">
            <h3>🥖 Городская Пекарня</h3>
            <p>Цена: 5000 руб | Доход: +10 руб/ч</p>
            <button class="action-btn btn-green" onclick="triggerAction('buy', 'bakery')">Купить Пекарню</button>
        </div>
        <div class="card">
            <h3>🏭 Тяжелый Завод</h3>
            <p>Цена: 25000 руб | Доход: +60 руб/ч</p>
            <button class="action-btn btn-green" onclick="triggerAction('buy', 'factory')">Купить Завод</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        function switchTab(pageId, tabButton) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            tabButton.classList.add('active');
        }

        function triggerAction(action, itemId) {
            const botUsername = "Hexon_game_bot";
            const deepLink = `https://t.me{botUsername}?start=${action}_${itemId}`;
            try {
                tg.openTelegramLink(deepLink);
                tg.close();
            } catch(e) {
                window.location.href = deepLink;
            }
        }

        // Пример подгрузки из initData / заглушка отображения
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            // Здесь в будущем можно завязать запрос к вашему python api
        }
    </script>
</body>
</html>
