<!DOCTYPE html><html lang="ru"><head><script src="https://telegram.org"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hexon Game Hub</title><style>:root{--bg-main:#0b0616;--bg-card:#140d26;--mint-neon:#00ffcc;--purple-neon:#9d00ff;--text-white:#ffffff;--text-gray:#887e9c;--accent-green:#00ffcc}body{background-color:var(--bg-main)!important;color:var(--text-white)!important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:16px;user-select:none;-webkit-tap-highlight-color:transparent}.header-balance{background:linear-gradient(180deg,rgba(157,0,255,.15) 0,rgba(20,13,38,.6) 100%)!important;border:1px solid rgba(157,0,255,.3)!important;border-radius:16px!important;padding:16px!important;margin-bottom:20px!important;box-shadow:0 8px 32px rgba(0,0,0,.5),inset 0 0 15px rgba(157,0,255,.1)!important;display:flex;justify-content:space-around;text-align:center}.balance-item span{color:var(--text-gray)!important;font-size:11px!important;text-transform:uppercase!important;letter-spacing:.8px!important;display:block;margin-bottom:4px}.balance-item strong{font-size:22px!important;color:#fff!important;text-shadow:0 0 12px var(--mint-neon)!important}.tabs{display:flex!important;flex-direction:row!important;justify-content:space-around!important;background-color:rgba(20,13,38,.8)!important;border:1px solid rgba(157,0,255,.2)!important;border-radius:12px!important;padding:4px!important;margin-bottom:20px!important;backdrop-filter:blur(10px)}.tab{flex:1!important;width:auto!important;padding:12px!important;margin:0!important;text-transform:none!important;letter-spacing:normal!important;border-radius:10px!important;color:var(--text-gray)!important;font-size:14px!important;font-weight:bold!important;background:none;border:none;cursor:pointer;transition:all .2s ease!important}.tab.active{background:linear-gradient(135deg,var(--purple-neon),#6700c7)!important;color:#fff!important;box-shadow:0 0 15px rgba(157,0,255,.6)!important}.page{display:none!important}.page.active{display:block!important}.card{background-color:var(--bg-card)!important;border:1px solid rgba(157,0,255,.2)!important;border-radius:16px!important;padding:20px!important;margin-bottom:16px!important;box-shadow:0 6px 20px rgba(0,0,0,.4)!important;position:relative}.card h3{color:var(--text-white)!important;font-size:18px!important;margin:0 0 6px 0!important}.card p{color:var(--mint-neon)!important;text-shadow:0 0 8px rgba(0,255,204,.2)!important;font-size:13px!important;margin:0 0 16px 0!important}.action-btn,button:not(.tab){display:block!important;width:100% !important;padding:14px!important;border:none!important;border-radius:12px!important;font-weight:800!important;font-size:14px!important;text-transform:uppercase!important;letter-spacing:.8px!important;cursor:pointer!important;transition:all .2s ease!important;text-align:center}.btn-green{background:linear-gradient(135deg,var(--purple-neon),#6700c7)!important;color:#fff!important;box-shadow:0 0 14px rgba(157,0,255,.4)!important}.btn-green:active{box-shadow:0 0 25px var(--purple-neon) !important;transform:scale(.98)}.btn-blue{background:linear-gradient(135deg,var(--mint-neon),#00b3ff)!important;color:#0b0616!important;box-shadow:0 0 14px rgba(0,255,204,.3)!important}.btn-blue:active{box-shadow:0 0 25px var(--mint-neon)!important;transform:scale(.98)}.btn-orange{background:#1d152e!important;color:var(--text-gray)!important;border:1px dashed rgba(157,0,255,.3)!important;box-shadow:none!important;pointer-events:none!important}.level-badge{background-color:rgba(0,255,204,.1)!important;color:var(--mint-neon)!important;border:1px solid rgba(0,255,204,.3)!important;padding:4px 10px!important;border-radius:8px!important;font-size:11px!important;font-weight:bold;float:right;position:absolute;top:20px;right:20px}</style></head><body><div class="header-balance"><div class="balance-item"><span>Игровые Рубли</span><strong id="rub-val">0.00 ₽</strong></div><div class="balance-item"><span>Токены NEXON</span><strong id="nexon-val" style="color:#00ffcc">0.0000</strong></div></div><div class="tabs"><button class="tab active" onclick="switchTab('work-page',this)">💼 Работа</button> <button class="tab" onclick="switchTab('business-page',this)">🏪 Бизнес</button></div><div id="work-page" class="page active"><div class="card"><h3>👷 Грузчик на склад</h3><p>Зарплата: 500 руб / 8 часов</p><button id="btn-loader" class="action-btn btn-blue" onclick="startWork('loader',500)">Начать смену (8ч)</button></div><div class="card"><h3>🚴 Курьер доставки</h3><p>Зарплата: 500 руб / 8 часов</p><button id="btn-courier" class="action-btn btn-blue" onclick="startWork('courier',500)">Начать смену (8ч)</button></div><div class="card"><h3>🚗 Водитель такси</h3><p>Зарплата: 500 руб / 8 часов</p><button id="btn-driver" class="action-btn btn-blue" onclick="startWork('driver',500)">Начать смену (8ч)</button></div></div><div id="business-page" class="page"><div class="card"><span id="lvl-bakery" class="level-badge">Ур. 0</span><h3>🥖 Городская Пекарня</h3><p>Доход: <span id="inc-bakery" style="color:var(--accent-green)">+0 руб/ч</span> | +0 NEXON/ч</p><button id="btn-upgrade-bakery" class="action-btn btn-green" onclick="requestServerUpgrade('bakery')">Купить за 5000 руб</button></div><div class="card"><span id="lvl-factory" class="level-badge">Ур. 0</span><h3>🏭 Тяжелый Завод</h3><p>Доход: <span id="inc-factory" style="color:var(--accent-green)">+0 руб/ч</span> | +0 NEXON/ч</p><button id="btn-upgrade-factory" class="action-btn btn-green" onclick="requestServerUpgrade('factory')">Купить за 25000 руб</button></div></div><script>var tg=window.Telegram?window.Telegram.WebApp:null;if(tg){tg.ready();tg.expand()}const bizConfig={bakery:{name:"Пекарня",baseCost:5000,stepCost:3500,stepRub:10,stepNexon:.5},factory:{name:"Завод",baseCost:25000,stepCost:15000,stepRub:60,stepNexon:3}};const urlParams=new URLSearchParams(window.location.search);let paramRub=urlParams.get("rub"),paramNexon=urlParams.get("nexon"),paramLvlBakery=urlParams.get("lb"),paramLvlFactory=urlParams.get("lf");if(null!==paramRub)localStorage.setItem("hexon_rub",paramRub);if(null!==paramNexon)localStorage.setItem("hexon_nexon",paramNexon);if(null!==paramLvlBakery)localStorage.setItem("hexon_lvl_bakery",paramLvlBakery);if(null!==paramLvlFactory)localStorage.setItem("hexon_lvl_factory",paramLvlFactory);var balanceRub=parseFloat(localStorage.getItem("hexon_rub")||"0"),balanceNexon=parseFloat(localStorage.getItem("hexon_nexon")||"0"),lvlBakery=parseInt(localStorage.getItem("hexon_lvl_bakery")||"0"),lvlFactory=parseInt(localStorage.getItem("hexon_lvl_factory")||"0");updateUI();updateBusinessUI();setInterval(checkWorkTimer,1000);setInterval(processPassiveIncome,1000);function updateUI(){document.getElementById("rub-val").innerText=balanceRub.toFixed(2)+" ₽";document.getElementById("nexon-val").innerText=balanceNexon.toFixed(4)}function switchTab(e,t){document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));document.querySelectorAll(".tab").forEach(e=>e.classList.remove("active"));document.getElementById(e).classList.add("active");t.classList.add("active")}function updateBusinessUI(){document.getElementById("lvl-bakery").innerText="Ур. "+lvlBakery;var e=lvlBakery*bizConfig.bakery.stepRub,t=lvlBakery*bizConfig.bakery.stepNexon;document.getElementById("inc-bakery").innerText="+"+e+" руб/ч | +"+t.toFixed(1)+" NEXON/ч";var n=0===lvlBakery?bizConfig.bakery.baseCost:bizConfig.bakery.baseCost+lvlBakery*bizConfig.bakery.stepCost;document.getElementById("btn-upgrade-bakery").innerText=0===lvlBakery?"Купить за "+n+" руб":"Улучшить за "+n+" руб";document.getElementById("lvl-factory").innerText="Ур. "+lvlFactory;var r=lvlFactory*bizConfig.factory.stepRub,a=lvlFactory*bizConfig.factory.stepNexon;document.getElementById("inc-factory").innerText="+"+r+" руб/ч | +"+a.toFixed(1)+" NEXON/ч";var c=0===lvlFactory?bizConfig.factory.baseCost:bizConfig.factory.baseCost+lvlFactory*bizConfig.factory.stepCost;document.getElementById("btn-upgrade-factory").innerText=0===lvlFactory?"Купить за "+c+" руб":"Улучшить за "+c+" руб"}function requestServerUpgrade(e){if(e){var t="Hexon_game_bot",n="https://t.me"+t+"?start=buy_"+e;if(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.openTelegramLink){window.Telegram.WebApp.openTelegramLink(n)}else{window.location.href=n}}}function processPassiveIncome(){var e=(lvlBakery*bizConfig.bakery.stepRub+lvlFactory*bizConfig.factory.stepRub)/3600,t=(lvlBakery*bizConfig.bakery.stepNexon+lvlFactory*bizConfig.factory.stepNexon)/3600;if(e>0||t>0){balanceRub+=e;balanceNexon+=t;updateUI()}}function startWork(e,t){var n=Math.floor(Date.now()/1000)+28800;localStorage.setItem("hexon_work_job",e);localStorage.setItem("hexon_work_end",n);localStorage.setItem("hexon_work_salary",t);if(tg&&tg.showPopup){tg.showPopup({title:"✅ Смена начата!",message:"Вы устроились на работу. Таймер пошел!",buttons:[{type:"ok",text:"Понятно"}]})}checkWorkTimer()}function checkWorkTimer(){var e=localStorage.getItem("hexon_work_job"),t=parseInt(localStorage.getItem("hexon_work_end")||"0"),n=Math.floor(Date.now()/1000);["loader","courier","driver"].forEach(function(r){var a=document.getElementById("btn-"+r);if(a){if(e===r&&t>n){var c=t-n,o=Math.floor(c/3600),i=Math.floor(c%3600/60),u=c%60,s=(o<10?"0"+o:o)+":"+(i<10?"0"+i:i)+":"+(u<10?"0"+u:u);a.className="action-btn btn-orange";a.innerText="Осталось: "+s}else if(e===r&&t<=n&&0!==t){var l=parseFloat(localStorage.getItem("hexon_work_salary")||"500");balanceRub+=l;updateUI();if(tg&&tg.showPopup){tg.showPopup({title:"💰 Смена окончена!",message:"Вам начислена зарплата: +"+l+" ₽. Перезайдите в игру для фиксации!",buttons:[{type:"ok",text:"Ура"}]})}localStorage.removeItem("hexon_work_job");localStorage.removeItem("hexon_work_end")}}})}</script></body></html>
