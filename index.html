<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hexon Game Hub</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c1e;
            --accent-blue: #2f80ed;
            --accent-green: #34c759;
            --accent-orange: #ff9500;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #3a3a3c;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }
        .header-balance {
            background: linear-gradient(135deg, #2c2c2e, #1c1c1e);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .balance-item span { display: block; font-size: 12px; color: var(--text-muted); }
        .balance-item strong { font-size: 16px; color: var(--accent-green); }
        
        .tabs {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
        }
        .tab.active { background-color: var(--accent-blue); color: var(--text-main); }
        .page { display: none; }
        .page.active { display: block; }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .card h3 { margin: 0 0 6px 0; font-size: 17px; }
        .card p { margin: 0 0 14px 0; font-size: 13px; color: var(--text-muted); }
        
        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            display: block;
        }
        .btn-blue { background-color: var(--accent-blue); color: #fff; }
        .btn-green { background-color: var(--accent-green); color: #fff; }
        .btn-orange { background-color: var(--accent-orange); color: #fff; pointer-events: none; }
    </style>
</head>
<body>

    <div class="header-balance">
        <div class="balance-item">
            <span>Игровые Рубли</span>
            <strong id="rub-val">500.00 ₽</strong>
        </div>
        <div class="balance-item">
            <span>Токены NEXON</span>
            <strong id="nexon-val" style="color: #00c7be;">0.0000</strong>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('work-page', this)">💼 Работа</button>
        <button class="tab" onclick="switchTab('business-page', this)">🏪 Купить бизнес</button>
    </div>

    <div id="work-page" class="page active">
        <div class="card">
            <h3>👷 Грузчик на склад</h3>
            <p>Зарплата: 500 руб / 8 часов</p>
            <button id="btn-loader" class="action-btn btn-blue" onclick="startWork('loader', 500)">Начать смену (8ч)</button>
        </div>
        <div class="card">
            <h3>🚴 Курьер доставки</h3>
            <p>Зарплата: 500 руб / 8 часов</p>
            <button id="btn-courier" class="action-btn btn-blue" onclick="startWork('courier', 500)">Начать смену (8ч)</button>
        </div>
        <div class="card">
            <h3>🚗 Водитель такси</h3>
            <p>Зарплата: 500 руб / 8 часов</p>
            <button id="btn-driver" class="action-btn btn-blue" onclick="startWork('driver', 500)">Начать смену (8ч)</button>
        </div>
    </div>

    <div id="business-page" class="page">
        <div class="card">
            <h3>🥖 Городская Пекарня</h3>
            <p>Цена: 5000 руб | Доход: +10 руб/ч</p>
            <button class="action-btn btn-green" onclick="buyBusiness('bakery', 5000)">Купить Пекарню</button>
        </div>
        <div class="card">
            <h3>🏭 Тяжелый Завод</h3>
            <p>Цена: 25000 руб | Доход: +60 руб/ч</p>
            <button class="action-btn btn-green" onclick="buyBusiness('factory', 25000)">Купить Завод</button>
        </div>
    </div>

    <script>
        var tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        var balanceRub = parseFloat(localStorage.getItem('hexon_rub') || '500');
        updateUI();

        // Запускаем проверку таймера каждую секунду
        setInterval(checkWorkTimer, 1000);

        function updateUI() {
            document.getElementById('rub-val').innerText = balanceRub.toFixed(2) + ' ₽';
        }

        function switchTab(pageId, tabButton) {
            document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
            document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
            document.getElementById(pageId).classList.add('active');
            tabButton.classList.add('active');
        }

        function startWork(jobId, salary) {
            var now = Math.floor(Date.now() / 1000);
            var endWorkTime = now + (8 * 3600); // 8 часов в секундах
            
            localStorage.setItem('hexon_work_job', jobId);
            localStorage.setItem('hexon_work_end', endWorkTime);
            localStorage.setItem('hexon_work_salary', salary);

            showMsg('✅ Смена начата!', 'Вы устроились на работу. Таймер пошел!');
            checkWorkTimer();
        }

        function checkWorkTimer() {
            var activeJob = localStorage.getItem('hexon_work_job');
            var endWorkTime = parseInt(localStorage.getItem('hexon_work_end') || '0');
            var now = Math.floor(Date.now() / 1000);

            var jobs = ['loader', 'courier', 'driver'];
            
            jobs.forEach(function(jId) {
                var btn = document.getElementById('btn-' + jId);
                if (!btn) return;

                if (activeJob === jId && endWorkTime > now) {
                    var diff = endWorkTime - now;
                    var hours = Math.floor(diff / 3600);
                    var minutes = Math.floor((diff % 3600) / 60);
                    var seconds = diff % 60;

                    var timeStr = (hours < 10 ? '0' + hours : hours) + ':' +
                                  (minutes < 10 ? '0' + minutes : minutes) + ':' +
                                  (seconds < 10 ? '0' + seconds : seconds);

                    btn.className = 'action-btn btn-orange';
                    btn.innerText = 'Осталось: ' + timeStr;
                } else if (activeJob === jId && endWorkTime <= now && endWorkTime !== 0) {
                    // Таймер дошел до конца — выдаем зарплату
                    var earned = parseFloat(localStorage.getItem('hexon_work_salary') || '500');
                    balanceRub += earned;
                    localStorage.setItem('hexon_rub', balanceRub);
                    updateUI();

                    showMsg('💰 Смена окончена!', 'Вам начислена зарплата: +' + earned + ' ₽');

                    // Сбрасываем смену
                    localStorage.removeItem('hexon_work_job');
                    localStorage.removeItem('hexon_work_end');
                    localStorage.removeItem('hexon_work_salary');

                    btn.className = 'action-btn btn-blue';
                    btn.innerText = 'Начать смену (8ч)';
                } else if (activeJob !== jId) {
                    btn.className = 'action-btn btn-blue';
                    btn.innerText = 'Начать смену (8ч)';
                }
            });
        }

        function buyBusiness(bId, cost) {
            if (balanceRub >= cost) {
                balanceRub -= cost;
                localStorage.setItem('hexon_rub', balanceRub);
                updateUI();
                showMsg('🎉 Успешно!', 'Бизнес куплен!');
            } else {
                showMsg('❌ Ошибка', 'Недостаточно игровых рублей на балансе.');
            }
        }

        function showMsg(titleText, messageText) {
            if (tg && tg.showPopup) {
                tg.showPopup({
                    title: titleText,
                    message: messageText,
                    buttons: [{type: 'ok', text: 'Понятно'}]
                });
            } else {
                alert(titleText + '\n' + messageText);
            }
        }
    </script>
</body>
</html>
