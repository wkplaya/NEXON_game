<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hexon Game Hub</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c1e;
            --accent-blue: #2f80ed;
            --accent-green: #34c759;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #3a3a3c;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }
        .tabs {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
        }
        .tab.active { background-color: var(--accent-blue); color: var(--text-main); }
        .page { display: none; }
        .page.active { display: block; }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .card h3 { margin: 0 0 6px 0; font-size: 17px; }
        .card p { margin: 0 0 14px 0; font-size: 13px; color: var(--text-muted); }
        
        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            display: block;
        }
        .btn-blue { background-color: var(--accent-blue); color: #fff; }
        .btn-green { background-color: var(--accent-green); color: #fff; }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('work-page', this)">💼 Работа</button>
        <button class="tab" onclick="switchTab('business-page', this)">🏪 Купить бизнес</button>
    </div>

    <!-- Вкладка: Работа -->
    <div id="work-page" class="page active">
        <div class="card">
            <h3>👷 Грузчик на склад</h3>
            <p>Зарплата: 500 руб / 8 часов</p>
            <button class="action-btn btn-blue" onclick="triggerAction('work', 'loader')">Начать смену (8ч)</button>
        </div>
        <div class="card">
            <h3>🚴 Курьер доставки</h3>
            <p>Зарплата: 500 руб / 8 часов</p>
            <button class="action-btn btn-blue" onclick="triggerAction('work', 'courier')">Начать смену (8ч)</button>
        </div>
        <div class="card">
            <h3>🚗 Водитель такси</h3>
            <p>Зарплата: 500 руб / 8 часов</p>
            <button class="action-btn btn-blue" onclick="triggerAction('work', 'driver')">Начать смену (8ч)</button>
        </div>
    </div>

    <!-- Вкладка: Бизнес -->
    <div id="business-page" class="page">
        <div class="card">
            <h3>🥖 Городская Пекарня</h3>
            <p>Цена: 5000 руб | Доход: +10 руб/ч</p>
            <button class="action-btn btn-green" onclick="triggerAction('buy', 'bakery')">Купить Пекарню</button>
        </div>
        <div class="card">
            <h3>🏭 Тяжелый Завод</h3>
            <p>Цена: 25000 руб | Доход: +60 руб/ч</p>
            <button class="action-btn btn-green" onclick="triggerAction('buy', 'factory')">Купить Завод</button>
        </div>
    </div>

    <script>
        var tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        function switchTab(pageId, tabButton) {
            document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
            document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
            document.getElementById(pageId).classList.add('active');
            tabButton.classList.add('active');
        }

        // НАДЁЖНЫЙ ОФИЦИАЛЬНЫЙ МЕТОД ДЛЯ КНОПОК РАБОТЫ И БИЗНЕСА
        function triggerAction(actionName, itemId) {
            if (tg) {
                var payload = {
                    action: actionName,
                    item_id: itemId
                };
                // Отправляем JSON строку боту через легальный шлюз клавиатуры
                tg.sendData(JSON.stringify(payload));
                tg.close();
            }
        }
    </script>
</body>
</html>
