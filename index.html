<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWA Game MVP</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .job-card {
            background-color: #2a2a2a;
            border: 2px solid #3a3a3a;
            border-radius: 10px;
            padding: 15px;
            margin: 15px auto;
            max-width: 300px;
            cursor: pointer;
            transition: 0.3s;
        }
        .job-card.selected {
            border-color: #0088cc;
            background-color: #223344;
        }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            max-width: 300px;
        }
        button:disabled {
            background-color: #555555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h2>💼 Биржа труда</h2>
    <p>Выберите профессию и начните смену:</p>

    <div id="jobs-container"></div>
    <button id="work-btn" disabled>Начать работу</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const jobs = [
            { id: "loader", name: "Грузчик", salary: "500 руб" },
            { id: "courier", name: "Курьер", salary: "500 руб" },
            { id: "driver", name: "Водитель", salary: "500 руб" }
        ];

        let selectedJobId = null;
        const container = document.getElementById("jobs-container");

        jobs.forEach(job => {
            const card = document.createElement("div");
            card.className = "job-card";
            card.innerHTML = `<h3>${job.name}</h3><p>Зарплата: ${job.salary}</p>`;
            
            card.addEventListener("click", () => {
                document.querySelectorAll(".job-card").forEach(c => c.classList.remove("selected"));
                card.classList.add("selected");
                selectedJobId = job.id;
                document.getElementById("work-btn").disabled = false;
            });
            
            container.appendChild(card);
        });

        document.getElementById("work-btn").addEventListener("click", () => {
            if (!selectedJobId) return;

            // Используем прямой диплинк в бота для активации работы, 
            // так как sendData часто блокируется политикой безопасности Telegram
            const botUsername = "8268777694:AAG2bMTDG9mOdd7PWOSETrlDyDABPLu8knQ"; // или ваш юзернейм бота
            // Безопасный метод открытия ссылки внутри телеграма с передачей действия
            // Вместо sendData передаем через системный вызов закрытия с переходом
            const payloadData = JSON.stringify({ action: "start_work", job_id: selectedJobId });
            
            if (tg.sendData) {
                try {
                    tg.sendData(payloadData);
                } catch(err) {
                    console.log("sendData error:", err);
                }
            }
            tg.close();
        });
    </script>
</body>
</html>
