<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hexon Game Hub</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c1e;
            --accent-blue: #2f80ed;
            --accent-green: #34c759;
            --accent-orange: #ff9500;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #3a3a3c;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }
        .header-balance {
            background: linear-gradient(135deg, #2c2c2e, #1c1c1e);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .balance-item span { display: block; font-size: 12px; color: var(--text-muted); }
        .balance-item strong { font-size: 16px; color: var(--accent-green); }
        
        .tabs {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
        }
        .tab.active { background-color: var(--accent-blue); color: var(--text-main); }
        .page { display: none; }
        .page.active { display: block; }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .card h3 { margin: 0 0 6px 0; font-size: 17px; }
        .card p { margin: 0 0 14px 0; font-size: 13px; color: var(--text-muted); }
        
        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            display: block;
        }
        .btn-blue { background-color: var(--accent-blue); color: #fff; }
        .btn-green { background-color: var(--accent-green); color: #fff; }
        .btn-orange { background-color: var(--accent-orange); color: #fff; pointer-events: none; }
        
        .level-badge {
            background-color: #3a3a3c;
            color: var(--accent-orange);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            float: right;
        }
    </style>
</head>
<body>

    <!-- Шапка балансов синхронизируется с базой сервера -->
    <div class="header-balance">
        <div class="balance-item">
            <span>Игровые Рубли</span>
            <strong id="rub-val">0.00 ₽</strong>
        </div>
        <div class="balance-item">
            <span>Токены NEXON</span>
            <strong id="nexon-val" style="color: #00c7be;">0.0000</strong>
        </div>
    </div>

    <!-- Навигация -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('work-page', this)">💼 Работа</button>
        <button class="tab" onclick="switchTab('business-page', this)">🏪 Бизнес</button>
    </div>

    <!-- Вкладка: Работа -->
    <div id="work-page" class="page active">
        <div class="card">
            <h3>👷 Грузчик на склад</h3>
            <p>Зарплата: 500 руб / 8 часов</p>
            <button id="btn-loader" class="action-btn btn-blue" onclick="startWork('loader', 500)">Начать смену (8ч)</button>
        </div>
        <div class="card">
            <h3>🚴 Курьер доставки</h3>
            <p>Зарплата: 500 руб / 8 часов</p>
            <button id="btn-courier" class="action-btn btn-blue" onclick="startWork('courier', 500)">Начать смену (8ч)</button>
        </div>
        <div class="card">
            <h3>🚗 Водитель такси</h3>
            <p>Зарплата: 500 руб / 8 часов</p>
            <button id="btn-driver" class="action-btn btn-blue" onclick="startWork('driver', 500)">Начать смену (8ч)</button>
        </div>
    </div>

    <!-- Вкладка: Бизнес -->
    <div id="business-page" class="page">
        <div class="card">
            <span id="lvl-bakery" class="level-badge">Ур. 0</span>
            <h3>🥖 Городская Пекарня</h3>
            <p>Доход: <span id="inc-bakery" style="color:var(--accent-green);">+0 руб/ч</span> | +0 NEXON/ч</p>
            <button id="btn-upgrade-bakery" class="action-btn btn-green" onclick="requestServerUpgrade('bakery')">Купить за 5000 руб</button>
        </div>
        <div class="card">
            <span id="lvl-factory" class="level-badge">Ур. 0</span>
            <h3>🏭 Тяжелый Завод</h3>
            <p>Доход: <span id="inc-factory" style="color:var(--accent-green);">+0 руб/ч</span> | +0 NEXON/ч</p>
            <button id="btn-upgrade-factory" class="action-btn btn-green" onclick="requestServerUpgrade('factory')">Купить за 25000 руб</button>
        </div>
    </div>

    <script>
        var tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Конфигурация экономики
        const bizConfig = {
            bakery: { name: "Пекарня", baseCost: 5000, stepCost: 3500, stepRub: 10, stepNexon: 0.5 },
            factory: { name: "Завод", baseCost: 25000, stepCost: 15000, stepRub: 60, stepNexon: 3.0 }
        };

        // Считываем балансы и уровни, которые прислала база данных из ссылки
        const urlParams = new URLSearchParams(window.location.search);
        let paramRub = urlParams.get('rub');
        let paramNexon = urlParams.get('nexon');
        let paramLvlBakery = urlParams.get('lb');
        let paramLvlFactory = urlParams.get('lf');

        if (paramRub !== null) localStorage.setItem('hexon_rub', paramRub);
        if (paramNexon !== null) localStorage.setItem('hexon_nexon', paramNexon);
        if (paramLvlBakery !== null) localStorage.setItem('hexon_lvl_bakery', paramLvlBakery);
        if (paramLvlFactory !== null) localStorage.setItem('hexon_lvl_factory', paramLvlFactory);

        // Инициализируем переменные на основе подтвержденных сервером данных
        var balanceRub = parseFloat(localStorage.getItem('hexon_rub') || '0');
        var balanceNexon = parseFloat(localStorage.getItem('hexon_nexon') || '0');
        var lvlBakery = parseInt(localStorage.getItem('hexon_lvl_bakery') || '0');
        var lvlFactory = parseInt(localStorage.getItem('hexon_lvl_factory') || '0');

        updateUI();
        updateBusinessUI();

        // Запуск живых таймеров пассивного дохода прямо на экране
        setInterval(checkWorkTimer, 1000);
        setInterval(processPassiveIncome, 1000);

        function updateUI() {
            document.getElementById('rub-val').innerText = balanceRub.toFixed(2) + ' ₽';
            document.getElementById('nexon-val').innerText = balanceNexon.toFixed(4);
        }

        function switchTab(pageId, tabButton) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            tabButton.classList.add('active');
        }

        function updateBusinessUI() {
            // Рендер Пекарни
            document.getElementById('lvl-bakery').innerText = 'Ур. ' + lvlBakery;
            var bIncomeRub = lvlBakery * bizConfig.bakery.stepRub;
            var bIncomeNexon = lvlBakery * bizConfig.bakery.stepNexon;
            document.getElementById('inc-bakery').innerText = '+' + bIncomeRub + ' руб/ч | +' + bIncomeNexon.toFixed(1) + ' NEXON/ч';
            var bNextCost = lvlBakery === 0 ? bizConfig.bakery.baseCost : bizConfig.bakery.baseCost + (lvlBakery * bizConfig.bakery.stepCost);
            document.getElementById('btn-upgrade-bakery').innerText = lvlBakery === 0 ? 'Купить за ' + bNextCost + ' руб' : 'Улучшить за ' + bNextCost + ' руб';

            // Рендер Завода
            document.getElementById('lvl-factory').innerText = 'Ур. ' + lvlFactory;
            var fIncomeRub = lvlFactory * bizConfig.factory.stepRub;
            var fIncomeNexon = lvlFactory * bizConfig.factory.stepNexon;
            document.getElementById('inc-factory').innerText = '+' + fIncomeRub + ' руб/ч | +' + fIncomeNexon.toFixed(1) + ' NEXON/ч';
            var fNextCost = lvlFactory === 0 ? bizConfig.factory.baseCost : bizConfig.factory.baseCost + (lvlFactory * bizConfig.factory.stepCost);
            document.getElementById('btn-upgrade-factory').innerText = lvlFactory === 0 ? 'Купить за ' + fNextCost + ' руб' : 'Улучшить за ' + fNextCost + ' руб';
        }

        // НАДЁЖНАЯ СЕРВЕРНАЯ ТРАНЗАКЦИЯ: отправляем запрос на покупку в базу данных бота
        function requestServerUpgrade(businessId) {
            var botUsername = "Hexon_game_bot";
            // Формируем редирект транзакции
            var deepLink = "https://t.me" + botUsername + "?start=buy_" + businessId;
            
            if (tg) {
                try {
                    tg.openTelegramLink(deepLink);
                    tg.close();
                                    } catch(e) {
                    window.location.href = deepLink;
                }
            } else {
                window.location.href = deepLink;
            }
        }

        // Визуальный майнинг в реальном времени каждую секунду на экране
        function processPassiveIncome() {
            var totalRubPerSec = ((lvlBakery * bizConfig.bakery.stepRub) + (lvlFactory * bizConfig.factory.stepRub)) / 3600;
            var totalNexonPerSec = ((lvlBakery * bizConfig.bakery.stepNexon) + (lvlFactory * bizConfig.factory.stepNexon)) / 3600;

            if (totalRubPerSec > 0 || totalNexonPerSec > 0) {
                balanceRub += totalRubPerSec;
                balanceNexon += totalNexonPerSec;
                updateUI();
            }
        }

        function startWork(jobId, salary) {
            var now = Math.floor(Date.now() / 1000);
            var endWorkTime = now + (8 * 3600);
            
            localStorage.setItem('hexon_work_job', jobId);
            localStorage.setItem('hexon_work_end', endWorkTime);
            localStorage.setItem('hexon_work_salary', salary);

            if (tg && tg.showPopup) {
                tg.showPopup({ title: '✅ Смена начата!', message: 'Вы устроились на работу. Таймер пошел!', buttons: [{type: 'ok', text: 'Понятно'}] });
            }
            checkWorkTimer();
        }

        function checkWorkTimer() {
            var activeJob = localStorage.getItem('hexon_work_job');
            var endWorkTime = parseInt(localStorage.getItem('hexon_work_end') || '0');
            var now = Math.floor(Date.now() / 1000);
            var jobs = ['loader', 'courier', 'driver'];
            
            jobs.forEach(function(jId) {
                var btn = document.getElementById('btn-' + jId);
                if (!btn) return;

                if (activeJob === jId && endWorkTime > now) {
                    var diff = endWorkTime - now;
                    var hours = Math.floor(diff / 3600);
                    var minutes = Math.floor((diff % 3600) / 60);
                    var seconds = diff % 60;
                    var timeStr = (hours < 10 ? '0' + hours : hours) + ':' + (minutes < 10 ? '0' + minutes : minutes) + ':' + (seconds < 10 ? '0' + seconds : seconds);

                    btn.className = 'action-btn btn-orange';
                    btn.innerText = 'Осталось: ' + timeStr;
                } else if (activeJob === jId && endWorkTime <= now && endWorkTime !== 0) {
                    var earned = parseFloat(localStorage.getItem('hexon_work_salary') || '500');
                    balanceRub += earned;
                    updateUI();

                    if (tg && tg.showPopup) {
                        tg.showPopup({ title: '💰 Смена окончена!', message: 'Вам начислена зарплата: +' + earned + ' ₽. Перезайдите в игру для фиксации!', buttons: [{type: 'ok', text: 'Ура'}] });
                    }

                    localStorage.removeItem('hexon_work_job');
                    localStorage.removeItem('hexon_work_end');
                }
            });
        }
    </script>
</body>
</html>
